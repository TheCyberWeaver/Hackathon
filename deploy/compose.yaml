services:
  backend:
    image: eclipse-temurin:21-jre
    working_dir: /app
    command: ["java", "-jar", "/app/backend.jar"]
    environment:
      PORT: "8080"
      APP_FRONTEND_ORIGIN: https://08.hackathon.ethz.ch
      APP_TESTING_PERMISSIONS: ${APP_TESTING_PERMISSIONS:-true}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/askpool}
      DATABASE_USER: askpool_app
      DATABASE_BASELINE: ${DATABASE_BASELINE:-false}
      MODERATION_URL: http://askpool-moderation:8090
      MODERATION_TIMEOUT_MS: "800"
    secrets:
      - app_password
    networks:
      - default
      - askpool_shared
    volumes:
      - ./artifacts/backend.jar:/app/backend.jar:ro
    restart: unless-stopped

  frontend:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./artifacts/frontend:/srv:ro
    depends_on:
      - backend
    restart: unless-stopped

secrets:
  app_password:
    file: ${ASKPOOL_APP_PASSWORD_FILE:?Set ASKPOOL_APP_PASSWORD_FILE to the VM app_password file}

networks:
  askpool_shared:
    external: true
