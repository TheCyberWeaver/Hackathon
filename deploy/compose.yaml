services:
  backend:
    image: eclipse-temurin:21-jre
    working_dir: /app
    command: ["java", "-jar", "/app/backend.jar"]
    environment:
      PORT: "8080"
      APP_FRONTEND_ORIGIN: https://08.hackathon.ethz.ch
    volumes:
      - ./artifacts/backend.jar:/app/backend.jar:ro
    restart: unless-stopped

  student-api:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "index.mjs"]
    environment:
      PORT: "3001"
      ASKPOOL_REQUIRE_USER_ID: "true"
      ASKPOOL_DATA_DIR: /data
    volumes:
      - ./artifacts/student-api:/app:ro
      - student-data:/data
    restart: unless-stopped

  frontend:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./artifacts/frontend:/srv:ro
    depends_on:
      - backend
      - student-api
    restart: unless-stopped

volumes:
  student-data:
