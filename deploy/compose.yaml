services:
  backend:
    image: eclipse-temurin:21-jre
    working_dir: /app
    command: ["java", "-jar", "/app/backend.jar"]
    environment:
      PORT: "8080"
      APP_FRONTEND_ORIGIN: https://08.hackathon.ethz.ch
    volumes:
      - ./artifacts/backend.jar:/app/backend.jar:ro
    restart: unless-stopped

  frontend:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./artifacts/frontend:/srv:ro
    depends_on:
      - backend
    restart: unless-stopped
