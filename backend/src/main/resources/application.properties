spring.application.name=backend
server.port=${PORT:8080}
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}
app.testing-permissions=${APP_TESTING_PERMISSIONS:false}
spring.config.import=optional:configtree:/run/secrets/
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/askpool}
spring.datasource.username=${DATABASE_USER:askpool_app}
spring.datasource.password=${DATABASE_PASSWORD:${app_password:}}
spring.flyway.baseline-on-migrate=${DATABASE_BASELINE:false}
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
